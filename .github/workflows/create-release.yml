name: Create Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: windows-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Changelog
        id: changelog
        run: |
          # Read version
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $tag = "v$version-pre"
          } else {
            $tag = "v$version"
          }

          $changelog = Get-Content CHANGELOG.txt -Raw
          $releaseNotes = (Get-Content RELEASE.md -Raw) `
            -replace '__VERSION__', $version `
            -replace '__TAG__', $tag

          $releaseBody = @"
          $changelog

          $releaseNotes
          "@

          # Export tag name
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag_name=$tag"

          # Export changelog
          Add-Content -Path $env:GITHUB_OUTPUT -Value "changelog_body<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $changelog
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

          # Export release notes
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_body<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $releaseBody
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

          Write-Host "Successfully read changelog"
        shell: pwsh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.event_name == 'pull_request' && 'v__VERSION__-pre' || 'v__VERSION__' }}
          releaseName: ${{ github.event_name == 'pull_request' && 'OverBuddy v__VERSION__ (Preview)' || 'OverBuddy v__VERSION__' }}
          releaseBody: ${{ steps.changelog.outputs.changelog_body }}
          releaseDraft: ${{ github.event_name == 'pull_request' }}
          prerelease: ${{ github.event_name == 'pull_request' }}

      - name: Update Release Body
        id: update_release
        uses: octokit/request-action@v3.x
        with:
          route: PATCH /repos/{repo}/releases/{release_id}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REPO: ${{ github.repository }}
          INPUT_RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          INPUT_BODY: ${{ toJSON(steps.changelog.outputs.release_body) }}
          INPUT_TAG_NAME: ${{ steps.changelog.outputs.tag_name }}

      - name: Handle Update Release Success
        run: echo "Successfully updated release body"
      - name: Handle Update Release Failure
        run: 'echo "Release could not be found. Request failed with status ${{ steps.update_release.outputs.status }}: ${{ steps.update_release.outputs.data }}"'
        if: ${{ failure() }}
